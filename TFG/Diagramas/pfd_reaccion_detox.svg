      <text x="15" y="19" font-family="Arial" font-size="12" font-weight="bold" fill="#111418">TABLA DE CORRIENTES Y BALANCE DE MATERIA DE DISEÑO (Base: 1 000 kg hueso aceituna seco)</text>
      
      <text x="15" y="52" font-family="Arial" font-size="10.5" fill="#111418"><b>Corriente 01 (Alimentación):</b> 1 000 kg Hueso seco + 3 000 kg H2O + 105 kg H2SO4 (Relación S/L 33% p/v)</text>
      <text x="15" y="74" font-family="Arial" font-size="10.5" fill="#111418"><b>Corriente 03 (Slurry R-101):</b> Hidrolizado a 128 ºC (Xilosa libre: ~70 kg, Acético: ~15 kg, Furfural: ~1.8 kg)</text>
      <text x="15" y="96" font-family="Arial" font-size="10.5" fill="#111418"><b>Corriente 04 (Sólido WIS F-101):</b> ~520 kg de sólido insoluble lavado (Celulosa ~48%, Lignina insoluble ~52%)</text>
      <text x="15" y="118" font-family="Arial" font-size="10.5" fill="#111418"><b>Corriente 06 (Líquido Detox D-101):</b> Furfural &lt;0.1 g/L (&gt;90% eliminación), Acético &lt;0.5 g/L (&gt;95% eliminación)</text>
      <text x="15" y="140" font-family="Arial" font-size="10.5" fill="#111418"><b>Corriente 08 (Biocatálisis R-201):</b> Cellic CTec2 (40 FPU/g sustrato) + S. cerevisiae Ethanol Red (1 g/L)</text>
      <text x="15" y="162" font-family="Arial" font-size="10.5" font-weight="bold" fill="#1d4e89">Corriente 09 (Caldo a Destilación): 86.8 kg Etanol (de hexosas) + 75.5 kg Etanol (de pentosas) = 162.3 kg Bioetanol / t</text>
